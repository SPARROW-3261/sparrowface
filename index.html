    <script>
      (function() {
        // Prevent MediaPipe / TensorFlow Lite WASM C++ stderr INFO messages from triggering error catches
        var origError = console.error;
        console.error = function() {
          var msg = arguments && arguments[0] ? String(arguments[0]) : '';
          if (
            msg.indexOf('XNNPACK delegate') !== -1 ||
            msg.indexOf('TensorFlow Lite') !== -1 ||
            msg.indexOf('INFO:') === 0 ||
            msg.indexOf('INFO: Created') !== -1
          ) {
            if (console.info) {
              console.info.apply(console, arguments);
            }
            return;
          }
          origError.apply(console, arguments);
        };

        var origWarn = console.warn;
        console.warn = function() {
          var msg = arguments && arguments[0] ? String(arguments[0]) : '';
          if (
            msg.indexOf('XNNPACK delegate') !== -1 ||
            msg.indexOf('TensorFlow Lite') !== -1 ||
            msg.indexOf('INFO:') === 0
          ) {
            if (console.info) {
              console.info.apply(console, arguments);
            }
            return;
          }
          origWarn.apply(console, arguments);
        };
      })();
    </script>
